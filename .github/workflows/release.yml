name: Release

# A v-prefixed tag publishes the npm package to GitHub Packages (@bawaaaaah/light-mcp-server) and
# the multi-arch image to GHCR — same scheme as wing-mcp-server. The tag is usually created by
# auto-tag.yml; by hand: `npm version minor && git push --follow-tags`. The full CI runs first.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack everything, but publish nothing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  npm:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, Playwright --with-deps may not follow at once
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          # scoped, so `npm ci` still installs express, zod… from npmjs.com
          scope: "@bawaaaaah"
      - run: npm ci
      # The tag's version goes into package.json for the publish only (never committed).
      - name: Set package.json version to match the tag
        if: github.ref_type == 'tag'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      # prepack builds dist/ and web/dist/ into the tarball
      - name: Publish
        if: github.ref_type == 'tag' || !inputs.dry_run
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack only (dry run)
        if: github.ref_type != 'tag' && inputs.dry_run
        run: npm pack --dry-run

  docker:
    name: Publish the image to GHCR
    needs: verify
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, Playwright --with-deps may not follow at once
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=light-mcp-server
            org.opencontainers.image.description=Contrôleur lumière DMX (Art-Net / sACN) piloté en web, MIDI, OSC et MCP
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' || !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          provenance: false
      - name: Attest the build provenance
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
