name: CI

on:
  push:
    branches: [main, "claude/**", "windows/**", "windows-menubar"]
  pull_request:
    branches: [main]
  # Called by release.yml so a release runs exactly the same checks before anything is published.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, Playwright --with-deps may not follow at once
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in engines; 24 is the current LTS.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
      - run: npm ci
      - name: Typecheck (server and web)
        run: npm run typecheck && npx tsc --noEmit -p web
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  windows-menubar:
    name: Windows menu bar app
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the Windows menu bar app
        shell: pwsh
        run: .\windows\build-app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-menubar
          path: windows/build/LightMCP/
          retention-days: 7

  ui:
    name: Browser tests (Playwright)
    runs-on: ubuntu-24.04
    # Chromium and its system libraries come ready in Playwright's image: installing them with
    # `playwright install --with-deps` hung on apt for 8, then 20 minutes on 2026-10-22. The tag
    # follows @playwright/test in package-lock.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
      - run: npm ci
      - name: The image's browsers are those of @playwright/test
        run: |
          if [ "$(node -p 'require("@playwright/test/package.json").version')" != "1.64.0" ]; then
            echo "::error::@playwright/test changed, update the image tag of this job"
            exit 1
          fi
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
